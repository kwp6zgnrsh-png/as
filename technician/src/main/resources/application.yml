server:  port: 8082  # 기사 서버는 8082 포트 사용spring:  datasource:    url: ${DB_URL:jdbc:mysql://localhost:3306/technician_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}    username: ${DB_USERNAME}    password: ${DB_PASSWORD}    driver-class-name: com.mysql.cj.jdbc.Driver  jpa:    hibernate:      ddl-auto: update # 테이블 자동 생성 및 수정    show-sql: true    properties:      hibernate:        format_sql: true