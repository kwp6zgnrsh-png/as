spring:
  config:
    import: optional:classpath:local.yaml
  application:
    name: as_request
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/as_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}

technician-service:
  base-url: ${TECHNICIAN_SERVICE_URL:http://localhost:8082}